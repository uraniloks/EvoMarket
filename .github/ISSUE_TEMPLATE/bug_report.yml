name: Bug report
description: Report a reproducible EvoMarket issue
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: addon-version
    attributes:
      label: EvoMarket version
      placeholder: 0.1.13
    validations:
      required: true
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: 26.2
    validations:
      required: true
  - type: textarea
    id: chat-message
    attributes:
      label: Chat message that was misclassified
      description: Remove private information before posting.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshot description
    validations:
      required: false
