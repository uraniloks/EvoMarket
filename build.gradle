plugins {
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // EvoPlus supplies the API at runtime. Do not bundle it into our jar.
    compileOnly 'com.github.evo-plus:evo-plus-api:1.8.0'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
// The current parser check is a dependency-free main() self-test, not a JUnit test.
// Gradle 9.7 treats an empty discovered test suite as a failure by default.
// Allow the build to continue; the self-test can be converted to JUnit separately.
tasks.withType(Test).configureEach {
    failOnNoDiscoveredTests = false
}
